# Audit policy for KubeScope.
# Writes get full request + response bodies so you can see what changed.
# Reads get metadata only: list responses can be huge and add little.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
rules:
  # Never log bodies of sensitive objects.
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets", "configmaps", "serviceaccounts/token"]
      - group: "authentication.k8s.io"
        resources: ["tokenreviews"]
  # Reads: who asked for what, no bodies.
  - level: Metadata
    verbs: ["get", "list", "watch"]
  # Everything else (create, update, patch, delete...): full bodies.
  - level: RequestResponse
